# Scheduled MLOps loop against the real database. Requires repository secrets:
#   DATABASE_URL (Supabase Postgres connection string), HF_API_TOKEN.
# The run fails (and notifies) when drift crosses the alert threshold or a gate fails.
name: MLOps

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain-and-monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-train.txt
      - name: Live evals against Hugging Face
        run: python -m evals.run_evals --live
      - name: Extract features
        run: python -m pipelines.build_features
      - name: Train challengers (skips when there is not enough data)
        run: |
          python -m pipelines.train_ranker || echo "ranker: not trained"
          python -m pipelines.train_risk || echo "risk: not trained"
      - name: Gate and promote
        run: |
          python -m pipelines.evaluate ranker || echo "ranker: kept champion"
          python -m pipelines.evaluate risk || echo "risk: kept champion"
      - name: Refresh reliability scores
        run: python -m pipelines.score_users
      - name: Drift report
        run: python -m pipelines.drift_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-${{ github.run_id }}
          path: |
            ml-service/reports/
            ml-service/models/production/
            ml-service/mlflow.db
