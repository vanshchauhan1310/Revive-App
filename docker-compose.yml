# Local stack: API + ml-service (+ MLflow UI). Supabase runs separately: either a hosted
# project or `supabase start` (Supabase CLI) - point SUPABASE_URL at it in backend/.env.
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ML_SERVICE_URL: http://ml:8000
    ports: ["3000:3000"]
    depends_on:
      ml:
        condition: service_healthy

  ml:
    build: ./ml-service
    env_file: ./ml-service/.env
    volumes:
      - ./ml-service/models/production:/srv/models/production:ro
    ports: ["8000:8000"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: mlflow ui --host 0.0.0.0 --port 5001 --backend-store-uri sqlite:////mlflow/mlflow.db
    volumes:
      - ./ml-service:/mlflow
    ports: ["5001:5001"]
    profiles: ["mlops"]
