# Release gates for prompt / model changes. CI runs the offline suite on every change;
# the live suite runs when HF_API_TOKEN is available (manual or scheduled workflow).
offline:
  suggest_parse_accuracy: 1.0       # recorded replies must parse/normalise exactly as expected
  impact_sanity: 1.0
live:
  toxicity_accuracy: 0.85
  suggest_json_valid_rate: 0.9
  suggest_category_accuracy: 0.7    # only evaluated when listing_photos.jsonl has entries
  p95_latency_ms: 15000
